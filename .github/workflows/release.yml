name: Release macOS app

on:
  push:
    branches:
      - main
    paths:
      - Info.plist

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and package
        run: zsh build-app.sh
      - name: Publish ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.zip dist/*.sha256 --clobber
          else
            gh release create "$tag" dist/*.zip dist/*.sha256 --target "$GITHUB_SHA" --notes-file RELEASE_NOTES.md
          fi
